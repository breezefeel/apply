function $(id){ return document.getElementById(id); }
function toast(msg){
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('on'); }, 1800);
}
function findGuide(id){
  for (var i=0;i<GUIDE.length;i++) if (GUIDE[i].id===id) return GUIDE[i];
  return null;
}
function cardHtml(g){
  var img = g.n
    ? '<img src="'+BASE+g.id+'/01.jpg" alt="'+g.toolKo+' '+g.name+'">'
    : '<div class="ph">'+(g.video ? '설명 + 영상' : '설명 가이드')+'</div>';
  var sub = g.n ? ('사진 '+g.n+'장 · 순서대로') : (g.video ? '설명 · 영상 참고' : '설명 참고');
  return '<a class="card'+(g.n?'':' video')+'" href="#'+g.id+'">'+
    img+'<div class="meta"><div class="k">'+g.toolKo+'</div><div class="n">'+g.name+'</div><div class="s">'+sub+'</div></div></a>';
}
function renderHub(){
  $('foamGrid').innerHTML = GUIDE.filter(function(g){ return g.tool==='foam'; }).map(cardHtml).join('');
  $('ballGrid').innerHTML = GUIDE.filter(function(g){ return g.tool==='ball'; }).map(cardHtml).join('');
}
function noteHtml(g){
  return '<div class="note">'+g.note.map(function(row){
    return '<p><b>'+row[0]+'</b> '+row[1]+'</p>';
  }).join('')+'</div>';
}
function renderDetail(id){
  var g = findGuide(id);
  if (!g) { location.hash=''; return; }
  var extraHref = g.extra || g.video || '';
  var extraLabel = g.extraLabel || (g.video ? '영상 보기' : '');
  var html = '<a class="back" href="#">← 목록</a>'+
    '<div class="ex-kicker">'+g.toolKo+'</div>'+
    '<h2 class="ex-title">'+g.name+'</h2>'+
    '<div class="copy-row">'+
      '<button type="button" onclick="copyLink()">이 링크 복사</button>'+
      (extraHref ? '<a href="'+extraHref+'" target="_blank" rel="noopener">'+extraLabel+'</a>' : '')+
    '</div>'+
    noteHtml(g);
  (g.sequences || []).forEach(function(seq){
    html += '<div class="seq-hd">'+seq.title+'</div>';
    seq.captions.forEach(function(cap, i){
      var n = seq.start + i;
      var nn = (n<10?'0':'')+n;
      html += '<figure class="step"><img src="'+BASE+g.id+'/'+nn+'.jpg" alt="'+g.name+' '+n+'단계" loading="lazy">'+
        '<figcaption><span class="num">'+n+'</span>'+cap+'</figcaption></figure>';
    });
  });
  html += '<p class="lead" style="margin-top:8px">통증 0~3만. 뼈 위는 피하고, 불편하면 멈추세요.</p>';
  html += '<a class="back" href="#">← 목록으로</a>';
  $('detail').innerHTML = html;
}
function copyLink(){
  var url = location.href;
  function done(){ toast('링크를 복사했습니다'); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) {}
    document.body.removeChild(ta);
  }
}
function route(){
  var id = (location.hash||'').replace(/^#/, '');
  if (!id) {
    $('hub').classList.remove('hidden');
    $('detail').classList.add('hidden');
    document.title = '셀프 소도구 가이드 | REAL MOVEMENT';
    window.scrollTo(0,0);
    return;
  }
  var g = findGuide(id);
  if (!g) { location.hash=''; return; }
  $('hub').classList.add('hidden');
  $('detail').classList.remove('hidden');
  renderDetail(id);
  document.title = g.toolKo+' · '+g.name+' | REAL MOVEMENT';
  window.scrollTo(0,0);
}
renderHub();
window.addEventListener('hashchange', route);
route();
</script>
