<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Re:Al 강사 · 회원 관리</title>
  <meta name="theme-color" content="#1e3a6e">
  <style>
    :root {
      --bg: #f0f4fa; --surface: #fff; --text: #1a2332; --dim: #64748b;
      --border: #e2e8f0; --blue: #1e3a6e; --blue-bg: #eef3fb; --blue-soft: #dbeafe;
      --green: #059669; --green-bg: #ecfdf5;
      --shadow: 0 2px 14px rgba(30,58,110,0.07);
      --radius: 12px; --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      min-height: 100dvh; padding-bottom: calc(88px + var(--safe-b));
    }
    .page-hd { background: linear-gradient(135deg,#1e3a6e,#2563eb); color:#fff; padding:14px 16px 12px; }
    .page-hd h1 { font-size:16px; font-weight:800; }
    .page-hd p { font-size:11px; opacity:.85; margin-top:2px; }
    main { max-width:760px; margin:0 auto; padding:12px 12px 20px; }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
    .card-title { font-size:14px; font-weight:800; color:var(--blue); margin-bottom:4px; }
    .card-sub { font-size:11px; color:var(--dim); margin-bottom:10px; }

    .toolbar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .btn { border:none; border-radius:9px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-ghost { background:var(--blue-bg); color:var(--blue); }
    .btn-eval { background:#7c3aed; color:#fff; }
    .btn-green { background:var(--green); color:#fff; }
    .btn-save { background:var(--blue); color:#fff; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }

    /* 오늘 회원 — 강사별 3줄 */
    .instructor-rows { display:flex; flex-direction:column; gap:10px; }
    .inst-row { display:flex; flex-direction:column; gap:6px; }
    .inst-row-hd {
      font-size:11px; font-weight:800; padding:5px 10px; border-radius:8px;
      color:var(--text);
    }
    .inst-row-chips { display:flex; flex-wrap:wrap; gap:8px; padding-left:2px; }
    .inst-empty { font-size:12px; color:var(--dim); padding:4px 8px; }
    .member-chip {
      border:2px solid var(--border); border-radius:999px;
      padding:7px 13px; font-size:13px; font-weight:700; cursor:pointer;
      transition: transform .12s, box-shadow .12s, opacity .12s;
    }
    .member-chip:hover { transform:translateY(-1px); box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .member-chip.on {
      box-shadow:0 0 0 2px var(--blue), 0 2px 10px rgba(30,58,110,.18);
      font-weight:800;
    }
    .member-chip.done {
      opacity:.72;
      text-decoration:line-through;
      text-decoration-color:rgba(0,0,0,.35);
    }
    .member-chip.done .sess { text-decoration:none; display:inline-block; }
    .member-chip .time-tag {
      font-size:10px; font-weight:600; opacity:.75; margin-right:4px;
    }
    .member-chip .sess { font-size:11px; font-weight:600; opacity:.85; margin-left:4px; }

    /* 선택 회원 2줄 */
    .member-brief {
      margin-top:12px; padding:12px; border-radius:10px;
      background:var(--blue-bg); border:1px solid #bfdbfe;
      display:none;
    }
    .member-brief.show { display:block; }
    .member-brief .line1 { font-size:14px; font-weight:700; }
    .member-brief .line1 .phone { font-weight:600; color:var(--dim); margin-left:8px; font-size:13px; }
    .member-brief .line2 { font-size:12px; color:var(--dim); margin-top:6px; white-space:pre-wrap; }

    /* Re:Al Movement 섹션 */
    .psp-section { margin-bottom:16px; }
    .psp-section-hd {
      font-size:12px; font-weight:800; color:var(--blue);
      padding:8px 10px; background:var(--blue-bg);
      border-radius:8px 8px 0 0; border:1px solid #bfdbfe; border-bottom:none;
    }
    .psp-section-body {
      border:1px solid var(--border); border-radius:0 0 10px 10px;
      padding:10px; background:#fafbfd;
    }
    .psp-goal-box {
      font-size:11px; color:var(--dim); background:#fff;
      border:1px solid var(--border); border-radius:8px;
      padding:10px; margin-bottom:10px; line-height:1.55;
    }
    .psp-goal-box strong { color:var(--text); }
    .psp-part-hd {
      display:flex; align-items:center; gap:8px;
      margin:12px 0 6px; font-size:12px; font-weight:700;
    }
    .psp-part-num {
      width:22px; height:22px; border-radius:50%;
      background:var(--blue); color:#fff;
      font-size:11px; font-weight:800;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .psp-part-card {
      background:#fff; border:1px solid var(--border);
      border-radius:10px; padding:8px 10px; margin-bottom:8px;
    }
    .method-row {
      display:grid; grid-template-columns:24px 1fr auto;
      gap:8px; align-items:start;
      padding:8px 6px; border-radius:8px; margin-bottom:2px;
    }
    .method-row:hover { background:rgba(255,255,255,.7); }
    .method-row.done {
      background:#ede9fe; border-left:3px solid #7c3aed;
    }
    .method-row.done .method-label { color:#5b21b6; font-weight:600; }
    .method-row.today { background:var(--green-bg); border-left:3px solid var(--green); }
    .method-row input { width:18px; height:18px; margin-top:2px; cursor:pointer; }
    .method-label { font-size:12px; font-weight:500; line-height:1.45; }
    .method-vid { font-size:10px; color:var(--green); margin-top:2px; }
    .vid-tag { font-size:10px; padding:2px 6px; border-radius:5px; background:#f1f5f9; color:#94a3b8; }
    .vid-tag.ok { background:var(--green-bg); color:var(--green); }
    .psp-trio { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:8px; }
    .psp-trio-item { background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 6px; text-align:center; }
    .psp-trio-ico { font-size:16px; margin-bottom:2px; }
    .psp-trio-t { font-size:10px; font-weight:700; }
    .psp-trio-s { font-size:9px; color:var(--dim); }
    .psp-coach-foot { font-size:10px; color:var(--dim); margin-bottom:10px; font-style:italic; }
    .psp-part-lead { font-size:11px; color:var(--dim); margin:0 0 8px; line-height:1.5; }
    .psp-align-chain { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-bottom:10px; }
    .psp-align-step { font-size:10px; font-weight:600; background:var(--blue-soft); color:var(--blue); padding:4px 8px; border-radius:6px; }
    .psp-align-arrow { font-size:10px; color:#94a3b8; }
    .movement-legend { display:flex; flex-wrap:wrap; gap:10px; font-size:10px; color:var(--dim); margin-bottom:10px; }
    .movement-legend span { display:inline-flex; align-items:center; gap:5px; }
    .legend-swatch { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
    .legend-swatch.done { background:#ede9fe; border:1px solid #7c3aed; }
    .legend-swatch.today { background:var(--green-bg); border:1px solid var(--green); }

    .add-panel { display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
    .add-panel.open { display:block; }
    .field { margin-bottom:8px; }
    .field label { display:block; font-size:11px; font-weight:600; color:var(--dim); margin-bottom:4px; }
    .field input, .field textarea { width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 10px; font:inherit; font-size:13px; }
    .check-inline { display:flex; align-items:center; gap:6px; font-size:12px; margin:8px 0; }

    .send-bar {
      position:fixed; bottom:0; left:0; right:0; z-index:40;
      background:var(--surface); border-top:1px solid var(--border);
      padding:10px 12px calc(10px + var(--safe-b));
      display:flex; gap:8px; align-items:center;
      box-shadow:0 -4px 20px rgba(0,0,0,.08);
    }
    .send-bar .actions { display:flex; gap:8px; flex-shrink:0; }
    .send-bar .info { flex:1; font-size:12px; color:var(--dim); min-width:0; }
    .send-bar .info strong { color:var(--text); display:block; font-size:13px; }

    .modal-overlay { position:fixed; inset:0; z-index:100; background:rgba(15,23,42,.5); display:none; align-items:flex-end; justify-content:center; }
    .modal-overlay.open { display:flex; }
    @media(min-width:560px){ .modal-overlay { align-items:center; padding:20px; } }
    .modal { background:#fff; width:100%; max-width:520px; max-height:92dvh; overflow:auto; border-radius:16px 16px 0 0; padding:18px 16px 24px; }
    @media(min-width:560px){ .modal { border-radius:16px; } }
    .modal-hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .modal-hd h2 { font-size:16px; font-weight:800; color:var(--blue); }
    .modal-close { border:none; background:#f1f5f9; width:32px; height:32px; border-radius:8px; font-size:18px; cursor:pointer; }
    .eval-tabs { display:flex; gap:6px; margin-bottom:12px; }
    .eval-tab { flex:1; border:1px solid var(--border); background:#fff; border-radius:8px; padding:8px; font-size:12px; font-weight:600; cursor:pointer; }
    .eval-tab.on { background:var(--blue-bg); border-color:var(--blue); color:var(--blue); }
    .eval-pane { display:none; } .eval-pane.on { display:block; }
    .report-box { white-space:pre-wrap; font-size:13px; line-height:1.65; background:#f8fafc; padding:12px; border-radius:8px; border:1px solid var(--border); max-height:45vh; overflow:auto; }
    .eval-send-row { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
    .eval-member-hint { font-size:12px; font-weight:700; color:var(--blue); margin-bottom:12px; padding:8px 10px; background:var(--blue-bg); border-radius:8px; }
    .pin-overlay { position:fixed; inset:0; z-index:200; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; padding:20px; }
    .pin-overlay.open { display:flex; }
    .pin-card { background:#fff; border-radius:16px; padding:24px 20px; width:100%; max-width:300px; }
    .toast { position:fixed; top:12px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:10px 16px; border-radius:999px; font-size:13px; z-index:300; opacity:0; transition:opacity .2s; pointer-events:none; }
    .toast.show { opacity:1; }
    .empty-hint { text-align:center; color:var(--dim); font-size:13px; padding:16px 8px; }
  </style>
</head>
<body>
  <div class="pin-overlay" id="pinOverlay">
    <div class="pin-card">
      <h2 style="text-align:center;margin-bottom:12px;font-size:16px;">강사 PIN</h2>
      <input type="tel" id="pinInput" maxlength="8" placeholder="PIN" style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;">
      <button type="button" class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="submitPin()">입장</button>
    </div>
  </div>

  <header class="page-hd">
    <h1>Re:Al 강사 · 회원 관리</h1>
    <p id="dateLine">—</p>
  </header>

  <main>
    <!-- 1. 오늘 예약 회원 -->
    <section class="card">
      <div class="card-title">오늘 예약 회원</div>
      <div class="card-sub">강사별 3줄 · 시트와 동일한 색상 · 완료 회원은 취소선</div>
      <div class="toolbar">
        <button type="button" class="btn btn-ghost" onclick="loadBoard()">새로고침</button>
        <button type="button" class="btn btn-ghost" onclick="toggleAddMember()">+ 회원 추가</button>
        <button type="button" class="btn btn-eval" onclick="openEvalModal()">초회 평가</button>
      </div>
      <div class="member-chips" id="memberChips"><span class="empty-hint">불러오는 중…</span></div>
      <div class="member-brief" id="memberBrief">
        <div class="line1"><span id="briefName">—</span><span class="phone" id="briefPhone"></span></div>
        <div class="line2" id="briefMemo">특이사항 없음</div>
      </div>
      <div class="add-panel" id="addMemberPanel">
        <div class="field"><label>이름</label><input type="text" id="addName"></div>
        <div class="field"><label>연락처</label><input type="tel" id="addPhone" placeholder="01012345678"></div>
        <label class="check-inline"><input type="checkbox" id="addSaveSheet" checked> 회원정보 시트 등록</label>
        <button type="button" class="btn btn-primary" onclick="addMember()">추가</button>
      </div>
    </section>

    <!-- Re:Al Movement -->
    <section class="card">
      <div class="card-title">Re:Al Movement</div>
      <div class="card-sub">전체 프로그램이 기본 표시됩니다. 회원 선택 시 이전 진도가 보라색으로 표시됩니다.</div>
      <div class="movement-legend">
        <span><i class="legend-swatch done"></i>이전에 진행한 항목</span>
        <span><i class="legend-swatch today"></i>오늘 새로 추가</span>
      </div>
      <div id="pspProgramList"><div class="empty-hint">불러오는 중…</div></div>
    </section>
  </main>

  <div class="send-bar">
    <div class="info">
      <strong id="sendMemberLabel">회원 미선택</strong>
      <span id="sendCountLabel">오늘 0개 선택</span>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-green" id="sendBtn" onclick="sendChecked()" disabled>영상 보내기</button>
      <button type="button" class="btn btn-save" id="saveBtn" onclick="saveSession()" disabled>저장하기</button>
    </div>
  </div>

  <!-- 초회 평가 모달 -->
  <div class="modal-overlay" id="evalModal">
    <div class="modal">
      <div class="modal-hd">
        <h2>초회 평가 (STEP01)</h2>
        <button type="button" class="modal-close" onclick="closeEvalModal()">×</button>
      </div>
      <div class="eval-tabs">
        <button type="button" class="eval-tab on" data-pane="evalWrite" onclick="switchEvalTab('evalWrite',this)">작성</button>
        <button type="button" class="eval-tab" data-pane="evalView" onclick="switchEvalTab('evalView',this)">기록·리포트</button>
      </div>
      <div class="eval-pane on" id="evalWrite">
        <p class="eval-member-hint" id="evalMemberHint">—</p>
        <div class="field"><label>History Taking</label><textarea id="evalHistory" rows="3"></textarea></div>
        <div class="field"><label>Inspection</label><textarea id="evalInspection" rows="2"></textarea></div>
        <div class="field"><label>Movement Test</label><textarea id="evalMovement" rows="2"></textarea></div>
        <div class="field"><label>Palpation</label><textarea id="evalPalpation" rows="2"></textarea></div>
        <div class="field"><label>추가 메모</label><textarea id="evalMemo" rows="2"></textarea></div>
        <label class="check-inline"><input type="checkbox" id="evalSendMember" checked> 저장 후 회원 발송</label>
        <button type="button" class="btn btn-primary" style="width:100%;margin-top:8px;" id="evalSubmitBtn" onclick="submitFirstEval()">AI 리포트 생성</button>
      </div>
      <div class="eval-pane" id="evalView">
        <p id="evalViewEmpty" class="empty-hint">저장된 초회 평가가 없습니다.</p>
        <div id="evalViewContent" hidden>
          <p style="font-size:11px;color:var(--dim);margin-bottom:8px;" id="evalViewDate"></p>
          <div class="report-box" id="evalReportBody"></div>
          <div class="eval-send-row">
            <p style="font-size:11px;color:var(--dim);margin-bottom:8px;">선택 회원 연락처로 리포트를 발송합니다.</p>
            <button type="button" class="btn btn-green" style="width:100%;" onclick="sendEvalSms()">보내기 (SMS)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwVJSc6rY5tcBSB1VaRi4DBEXGyUBr1ADFfs6QEA9Z9bu0G-0mdMAv374-MdPVYMnSaeQ/exec';
    const PIN_KEY = 'real_instructor_pin_v1';
    const CUSTOM_KEY = 'real_instructor_custom_v1';
    const INSTRUCTORS_FALLBACK = [
      { index:0, name:'박준규', color:'#BDD7EE', lightColor:'#DEEEF7' },
      { index:1, name:'최진옥', color:'#FCE4D6', lightColor:'#FEF2EB' },
      { index:2, name:'이상민', color:'#E2EFDA', lightColor:'#F0F7EB' },
    ];

    const SECTION_META = {
      posture: {
        goal: '밸런스를 잡으며 천천히 움직입니다. 가능하면 거울을 보며 좌우·전후 대칭, 호흡, 긴장 최소화를 확인합니다. 기초 체력 향상이 또 다른 목표입니다.',
        trio: [
          { t:'편안한 호흡', s:'자연스럽게 흐름', ico:'🌬' },
          { t:'긴장 자각', s:'스스로 판단', ico:'🧠' },
          { t:'자기 조절', s:'스스로 해소', ico:'🔄' },
        ],
        coachFoot: '코치의 역할 — 이 세 가지를 스스로 할 수 있도록 안내하는 것',
        programLeads: {
          '1': '편안한 호흡 다음으로 호흡 운동을 코칭하며 몸을 바르게 정렬합니다.',
          '2': '호흡·정렬 후 · 상·하체를 번갈아 분절 → 정식 Sit-up · 천천히 구르기로 마무리.',
          '3': '엎드린 채 후방 경선·체간 안정·회전을 단계적으로 진행합니다.',
        },
        alignChain: ['엉덩이','발','무릎','척추','어깨','손끝'],
      },
    };
    function programSortKey(name) {
      const m = String(name||'').match(/^(\d+)/);
      const n = m ? parseInt(m[1],10) : 99;
      var postureOrder = { 1:0, 3:1, 2:2 };
      return postureOrder[n] != null ? postureOrder[n] : n;
    }

    /* 서버 연결 전에도 표시 — code.gs PSP_PROGRAM_CATALOG_ 와 동기화 */
    const MOVEMENT_CATALOG_RAW = [
      { id:'tool_list', uiSection:'self_tool', sectionTitle:'셀프 소도구 자극', program:'소도구 목록', label:'소도구 목록', linkUrl:'https://blog.naver.com/allenjoy/222657632345' },
      { id:'ball_shoulder', uiSection:'self_tool', sectionTitle:'셀프 소도구 자극', program:'12센티 마사지볼', label:'어깨', linkUrl:'https://www.youtube.com/watch?v=drx2-P2OgpQ' },
      { id:'ball_waist', uiSection:'self_tool', sectionTitle:'셀프 소도구 자극', program:'12센티 마사지볼', label:'허리', linkUrl:'https://www.youtube.com/watch?v=PgKSRcIW9c4' },
      { id:'ball_abdomen', uiSection:'self_tool', sectionTitle:'셀프 소도구 자극', program:'12센티 마사지볼', label:'복부', linkUrl:'https://www.youtube.com/shorts/zjvXLTL9E5A' },
      { id:'ball_hip', uiSection:'self_tool', sectionTitle:'셀프 소도구 자극', program:'12센티 마사지볼', label:'엉덩이', linkUrl:'https://m.blog.naver.com/allenjoy/223442108509' },
      { id:'ball_scapula', uiSection:'self_tool', sectionTitle:'셀프 소도구 자극', program:'12센티 마사지볼', label:'견갑골', linkUrl:'https://m.blog.naver.com/allenjoy/223449532242' },
      { id:'p1_sl_p', uiSection:'pos1_par', sectionTitle:'Position 1 · Supine/Prone', program:'① Supine Lower', label:'Passive Stretching (P-ROM) · 발→발목→무릎→고관절' },
      { id:'p1_sl_aa', uiSection:'pos1_par', sectionTitle:'Position 1 · Supine/Prone', program:'① Supine Lower', label:'Assisted Active (CIE · Hold&Relax · Pull&Push)' },

    function buildLocalProgram() {
      return MOVEMENT_CATALOG_RAW.map(function(item) {
        var url = item.linkUrl || '';
        return Object.assign({}, item, {
          group: item.sectionTitle,
          hasVideo: !!url,
          videoTitle: item.label,
          youtubeUrl: url,
        });
      });
    }

    let state = {
      pin: sessionStorage.getItem(PIN_KEY) || '',
      board: null,
      program: buildLocalProgram(),
      boardOnline: false,
      selected: null,
      selectedKey: '',
      savedProgress: {},
      todayProgress: {},
      customMembers: [],
      evalReportText: '',
      completedKeys: {},
    };

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(function () { el.classList.remove('show'); }, 2800);
    }
    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    async function api(payload) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(Object.assign({ pin: state.pin }, payload)),
        });
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch (parseErr) {
          return { ok: false, message: '서버 응답 형식 오류' };
        }
      } catch (err) {
        return { ok: false, offline: true, message: '서버 연결 실패 (로컬 파일이면 웹 호스팅 필요)' };
      }
    }
    function setMemberChipsMessage(msg) {
      document.getElementById('memberChips').innerHTML = '<span class="empty-hint">' + escapeHtml(msg) + '</span>';
    }
    function loadCustomMembers() {
      try { state.customMembers = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch(e) { state.customMembers = []; }
    }
    function saveCustomMembers() { localStorage.setItem(CUSTOM_KEY, JSON.stringify(state.customMembers)); }
    function memberKey(m) {
      return (m.suffix8 || ('n:' + m.name)) + '|' + (m.time || '') + '|' + (m.instructorIndex != null ? m.instructorIndex : '');
    }
    function isMemberCompleted(m) {
      return !!(m.sessionCompleted || m.attendedToday || state.completedKeys[memberKey(m)]);
    }
    function instructorsList() {
      return (state.board && state.board.instructors && state.board.instructors.length)
        ? state.board.instructors : INSTRUCTORS_FALLBACK;
    }
    function chipKeyAttr(key) {
      return String(key).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }
    function formatPhone(d) {
      const s = String(d).replace(/\D/g,'');
      return s.length === 11 ? s.slice(0,3)+'-'+s.slice(3,7)+'-'+s.slice(7) : s;
    }
    function parseTime(t) {
      const m = String(t||'').match(/(\d{1,2}):(\d{2})/);
      return m ? parseInt(m[1],10)*60+parseInt(m[2],10) : 9999;
    }
    function todayMembers() {
      const list = (state.board && state.board.members) ? state.board.members.slice() : [];
      const keys = {};
      list.forEach(function(m){ keys[memberKey(m)] = true; });
      state.customMembers.forEach(function(m){
        if (!keys[memberKey(m)]) list.push(m);
      });
      return list;
    }
    function mergedProgressMap() {
      const out = {};
      Object.keys(state.savedProgress).forEach(function(k){ if(state.savedProgress[k]) out[k]=['done']; });
      Object.keys(state.todayProgress).forEach(function(k){ if(state.todayProgress[k]) out[k]=['done']; });
      return out;
    }
    function methodRowClass(id) {
      if (state.todayProgress[id]) return ' today';
      if (state.savedProgress[id]) return ' done';
      return '';
    }
    function isMethodChecked(id) {
      return !!(state.savedProgress[id] || state.todayProgress[id]);
    }

    function showPin(show) {
      document.getElementById('pinOverlay').classList.toggle('open', show);
      if (show) setTimeout(function () { document.getElementById('pinInput').focus(); }, 80);
    }

    async function submitPin() {
      const pin = document.getElementById('pinInput').value.trim();
      const data = await api({ action:'instructorVerifyPin', pin:pin });
      if (data.ok || !data.pinRequired) {
        state.pin = pin; sessionStorage.setItem(PIN_KEY,pin); showPin(false); loadBoard();
      } else toast(data.message || 'PIN 확인');
    }

    async function loadBoard() {
      loadCustomMembers();
      setMemberChipsMessage('불러오는 중…');
      const data = await api({ action: 'instructorDayBoard' });

      if (data.needPin) {
        showPin(true);
        state.boardOnline = false;
        document.getElementById('dateLine').textContent = '강사 PIN 입력 필요';
        setMemberChipsMessage('PIN 입력 후 회원 목록을 불러옵니다');
        renderProgramList();
        return;
      }

      if (!data.ok) {
        state.boardOnline = false;
        document.getElementById('dateLine').textContent = '오프라인 · 프로그램만 표시';
        setMemberChipsMessage(data.offline
          ? '서버 연결 실패 — HTTPS로 열거나 새로고침'
          : (data.message || '회원 목록 불러오기 실패'));
        if (!state.program.length) state.program = buildLocalProgram();
        renderProgramList();
        toast(data.message || '서버 연결 실패');
        return;
      }

      state.board = data;
      state.boardOnline = true;
      state.program = data.pspProgram || data.pspCatalog || state.program;
      document.getElementById('dateLine').textContent =
        (data.date || '') + ' (' + (data.dayKr || '') + ') · 예약 ' + (data.members || []).length + '명';
      renderMemberChips();
      renderProgramList();
      if (state.selectedKey) {
        const m = todayMembers().find(function(x) { return memberKey(x) === state.selectedKey; });
        if (m) selectMember(m, false);
      }
    }

    function renderMemberChips() {
      const root = document.getElementById('memberChips');
      const members = todayMembers();
      const instructors = instructorsList();
      if (!members.length) {
        root.innerHTML = '<span class="empty-hint">오늘 예약 없음</span>';
        return;
      }
      members.sort(function(a, b) {
        var ia = a.instructorIndex != null ? a.instructorIndex : 99;
        var ib = b.instructorIndex != null ? b.instructorIndex : 99;
        if (ia !== ib) return ia - ib;
        return parseTime(a.time) - parseTime(b.time) || String(a.name).localeCompare(String(b.name), 'ko');
      });
      let html = '<div class="instructor-rows">';
      instructors.forEach(function(inst) {
        const rowMembers = members.filter(function(m) {
          return (m.instructorIndex != null ? m.instructorIndex : -1) === inst.index;
        });
        html += '<div class="inst-row">';
        html += '<div class="inst-row-hd" style="background:'+escapeHtml(inst.lightColor || inst.color)+';border-left:4px solid '+escapeHtml(inst.color)+'">'+escapeHtml(inst.name)+'</div>';
        html += '<div class="inst-row-chips">';
        if (!rowMembers.length) {
          html += '<span class="inst-empty">예약 없음</span>';
        } else {
          rowMembers.forEach(function(m) {
            const key = memberKey(m);
            const bg = m.instructorLightColor || inst.lightColor || inst.color;
            const border = m.instructorColor || inst.color;
            const done = isMemberCompleted(m);
            const on = state.selectedKey === key ? ' on' : '';
            const sess = m.sessionDisplay || '';
            const timeTag = m.time ? '<span class="time-tag">'+escapeHtml(m.time)+'</span>' : '';
            html += '<button type="button" class="member-chip'+on+(done?' done':'')+'" style="background:'+escapeHtml(bg)+';border-color:'+escapeHtml(border)+'" onclick="selectMemberByKey(\''+chipKeyAttr(key)+'\')">'+
              timeTag + escapeHtml(m.name) + (sess ? '<span class="sess">'+escapeHtml(sess)+'</span>' : '') + '</button>';
          });
        }
        html += '</div></div>';
      });
      const others = members.filter(function(m) {
        var ix = m.instructorIndex;
        return ix == null || ix < 0 || ix >= instructors.length;
      });
      if (others.length) {
        html += '<div class="inst-row"><div class="inst-row-hd" style="background:#f1f5f9;border-left:4px solid #94a3b8">기타</div><div class="inst-row-chips">';
        others.forEach(function(m) {
          const key = memberKey(m);
          const done = isMemberCompleted(m);
          const on = state.selectedKey === key ? ' on' : '';
          html += '<button type="button" class="member-chip'+on+(done?' done':'')+'" onclick="selectMemberByKey(\''+chipKeyAttr(key)+'\')">'+escapeHtml(m.name)+'</button>';
        });
        html += '</div></div>';
      }
      html += '</div>';
      root.innerHTML = html;
    }

    function selectMemberByKey(key) {
      const m = todayMembers().find(function(x){ return memberKey(x)===key; });
      if (m) selectMember(m, true);
    }

    async function selectMember(m, fromUser) {
      state.selected = m;
      state.selectedKey = memberKey(m);
      state.todayProgress = {};
      state.savedProgress = {};
      const prog = m.pspProgress || {};
      Object.keys(prog).forEach(function(id){
        if (prog[id] && prog[id].length) state.savedProgress[id] = true;
      });
      if (m.suffix8) {
        const detail = await api({ action:'instructorMemberDetail', suffix8:m.suffix8 });
        if (detail.ok && detail.member) {
          m.specialNotes = detail.member.specialNotes || (m.memoSummary && m.memoSummary.specialNotes) || '';
          Object.keys(detail.member.pspProgress || {}).forEach(function(id){
            if (detail.member.pspProgress[id] && detail.member.pspProgress[id].length) state.savedProgress[id] = true;
          });
        } else {
          Object.keys(m.pspProgress || prog).forEach(function(id){
            if ((m.pspProgress||prog)[id] && (m.pspProgress||prog)[id].length) state.savedProgress[id]=true;
          });
          m.specialNotes = (m.memoSummary && m.memoSummary.specialNotes) || '';
        }
        loadFirstEvalView(m.phoneDigits);
      } else {
        m.specialNotes = m.memo || '';
      }

      document.getElementById('memberBrief').classList.add('show');
      document.getElementById('briefName').textContent = m.name || '—';
      document.getElementById('briefPhone').textContent = m.phoneDigits ? formatPhone(m.phoneDigits) : '';
      const memo = (m.specialNotes || '').trim() || '특이사항 없음';
      document.getElementById('briefMemo').textContent = memo;

      document.getElementById('sendMemberLabel').textContent = (m.name || '회원') + '님';
      renderMemberChips();
      renderProgramList();
      updateSendBar();
    }

    function renderProgramList() {
      const root = document.getElementById('pspProgramList');
      const list = state.program;
      if (!list.length) {
        root.innerHTML = '<div class="empty-hint">프로그램 없음</div>';
        return;
      }
      const hasMember = !!state.selected;

      const sections = ['self_tool','pos1_par','posture','pos2','pos3','func'];
      const sectionOrder = {};
      sections.forEach(function(s,i){ sectionOrder[s]=i; });
      const grouped = {};
      list.forEach(function(item){
        const sec = item.uiSection || 'other';
        if (!grouped[sec]) grouped[sec] = { title: item.sectionTitle || item.group, items: [] };
        grouped[sec].items.push(item);
      });

      let html = '';
      sections.forEach(function(secKey){
        const g = grouped[secKey];
        if (!g) return;
        html += '<div class="psp-section"><div class="psp-section-hd">'+escapeHtml(g.title)+'</div><div class="psp-section-body">';
        if (secKey === 'posture') {
          html += '<div class="psp-goal-box"><strong>공통 목표</strong> — '+escapeHtml(SECTION_META.posture.goal)+'</div>';
          html += '<div class="psp-trio">';
          SECTION_META.posture.trio.forEach(function(t){
            html += '<div class="psp-trio-item"><div class="psp-trio-ico">'+t.ico+'</div>'+
              '<div class="psp-trio-t">'+escapeHtml(t.t)+'</div><div class="psp-trio-s">'+escapeHtml(t.s)+'</div></div>';
          });
          html += '</div><p class="psp-coach-foot">'+escapeHtml(SECTION_META.posture.coachFoot)+'</p>';
        }
        let programsInSection = {};
        g.items.forEach(function(item){
          if (!programsInSection[item.program]) programsInSection[item.program] = [];
          programsInSection[item.program].push(item);
        });
        Object.keys(programsInSection).sort(function(a,b){
          const na = programSortKey(a), nb = programSortKey(b);
          if (na !== nb) return na - nb;
          return String(a).localeCompare(String(b),'ko');
        }).forEach(function(progName){
          const items = programsInSection[progName];
          if (secKey === 'posture') {
            const numMatch = progName.match(/^(\d+)/);
            const num = numMatch ? numMatch[1] : '';
            html += '<div class="psp-part-hd">'+(num ? '<span class="psp-part-num">'+num+'</span>' : '')+
              '<span>'+escapeHtml(progName.replace(/^\d+\s*·\s*/,''))+'</span></div>';
            const lead = SECTION_META.posture.programLeads[num];
            if (lead) html += '<p class="psp-part-lead">'+escapeHtml(lead)+'</p>';
            if (num === '1') {
              html += '<div class="psp-align-chain">';
              SECTION_META.posture.alignChain.forEach(function(step, i){
                if (i) html += '<span class="psp-align-arrow">→</span>';
                html += '<span class="psp-align-step">'+escapeHtml(step)+'</span>';
              });
              html += '</div>';
            }
          } else {
            html += '<div class="psp-part-hd" style="margin-top:4px;"><span>'+escapeHtml(progName)+'</span></div>';
          }
          html += '<div class="psp-part-card">';
          items.forEach(function(item){
            const checked = hasMember && isMethodChecked(item.id);
            const rowCls = hasMember ? methodRowClass(item.id) : '';
            const tagLabel = item.hasVideo ? (secKey === 'self_tool' ? '링크' : '영상') : 'URL없음';
            const vidTag = '<span class="vid-tag'+(item.hasVideo?' ok':'')+'">'+tagLabel+'</span>';
            html += '<label class="method-row'+rowCls+'">'+
              '<input type="checkbox"'+(checked?' checked':'')+' onchange="toggleToday(\''+item.id+'\',this)">'+
              '<div><div class="method-label">'+escapeHtml(item.label)+'</div>'+
              (item.videoTitle ? '<div class="method-vid">▶ '+escapeHtml(item.videoTitle)+'</div>' : '')+
              '</div>'+vidTag+'</label>';
          });
          html += '</div>';
        });
        html += '</div></div>';
      });
      root.innerHTML = html;
    }

    async function toggleToday(id, cb) {
      if (!state.selected) {
        toast('회원을 먼저 선택해 주세요'); cb.checked = false; return;
      }
      if (!state.selected.suffix8) {
        toast('시트 연동 회원을 선택해 주세요'); cb.checked = false; return;
      }
      if (cb.checked) {
        if (!state.savedProgress[id]) state.todayProgress[id] = true;
      } else {
        delete state.todayProgress[id];
        delete state.savedProgress[id];
      }
      renderProgramList();
      updateSendBar();
      await autoSaveProgress();
    }

    async function autoSaveProgress() {
      const m = state.selected;
      if (!m || !m.suffix8) return;
      const todayLabels = Object.keys(state.todayProgress).map(function(id){
        const p = state.program.find(function(x){ return x.id===id; });
        return p ? p.label : id;
      });
      const data = await api({
        action:'instructorSaveSession',
        suffix8:m.suffix8, name:m.name, time:m.time, instructorIndex:m.instructorIndex,
        specialNotes: (m.specialNotes || '').trim(),
        sessionNote: todayLabels.length ? '오늘 진도: ' + todayLabels.join(', ') : '',
        pspProgress: mergedProgressMap(),
      });
      if (data.ok) {
        Object.keys(state.todayProgress).forEach(function(k){ state.savedProgress[k]=true; });
        state.todayProgress = {};
        renderProgramList();
        updateSendBar();
      } else {
        toast(data.message || '진도 저장 실패');
      }
    }

    function updateSendBar() {
      const todayN = Object.keys(state.todayProgress).length;
      const doneN = Object.keys(state.savedProgress).length;
      const withVideo = state.program.filter(function(p){
        return (state.todayProgress[p.id] || state.savedProgress[p.id]) && p.hasVideo;
      }).length;
      let label = '진도 ' + doneN + '개';
      if (todayN) label += ' · 오늘 +' + todayN;
      if (withVideo) label += ' · 영상 ' + withVideo + '개';
      document.getElementById('sendCountLabel').textContent = label;
      const hasMember = !!(state.selected && state.selected.suffix8);
      const hasProgress = Object.keys(state.savedProgress).length + Object.keys(state.todayProgress).length > 0;
      document.getElementById('sendBtn').disabled = !state.selected || !withVideo;
      document.getElementById('saveBtn').disabled = !hasMember || !hasProgress;
    }

    function sessionNoteFromProgress() {
      const ids = Object.keys(mergedProgressMap());
      const labels = ids.map(function(id) {
        const p = state.program.find(function(x) { return x.id === id; });
        return p ? p.label : id;
      });
      return labels.length ? '오늘 진도: ' + labels.join(', ') : '';
    }

    async function saveSession() {
      const m = state.selected;
      if (!m || !m.suffix8) { toast('회원 선택'); return; }
      const progress = mergedProgressMap();
      if (!Object.keys(progress).length) { toast('진도를 체크해 주세요'); return; }
      document.getElementById('saveBtn').disabled = true;
      const data = await api({
        action: 'instructorCompleteSession',
        suffix8: m.suffix8,
        name: m.name,
        time: m.time,
        instructorIndex: m.instructorIndex,
        rowKey: m.rowKey || m.rowIndex,
        phoneLast4: m.phoneLast4,
        specialNotes: (m.specialNotes || '').trim(),
        sessionNote: sessionNoteFromProgress(),
        pspProgress: progress,
      });
      document.getElementById('saveBtn').disabled = false;
      if (data.ok) {
        Object.keys(state.todayProgress).forEach(function(k) { state.savedProgress[k] = true; });
        state.todayProgress = {};
        state.completedKeys[memberKey(m)] = true;
        m.sessionCompleted = true;
        m.attendedToday = !!data.completed;
        if (data.sessionDisplay) m.sessionDisplay = data.sessionDisplay;
        if (data.completed) toast('저장·완료 처리됨');
        else toast(data.attendMessage || '진도 저장됨');
        renderProgramList();
        renderMemberChips();
        updateSendBar();
      } else {
        toast(data.message || '저장 실패');
      }
    }

    async function sendChecked() {
      const m = state.selected;
      if (!m) { toast('회원 선택'); return; }
      const ids = Object.keys(state.todayProgress);
      const savedIds = Object.keys(state.savedProgress);
      if (!ids.length && !savedIds.length) { toast('진도를 체크해 주세요'); return; }
      const methodIds = ids.length ? ids.concat(savedIds.filter(function(s){ return ids.indexOf(s)<0; })) : savedIds;
      const sendable = state.program.filter(function(p){ return methodIds.indexOf(p.id)>=0 && p.hasVideo; });
      if (!sendable.length) { toast('영상 URL이 있는 항목이 없습니다'); return; }
      const payload = { action:'instructorSendHomework', methodIds:methodIds };
      if (m.suffix8) payload.suffix8List = [m.suffix8];
      else if (m.phoneDigits) payload.phones = [m.phoneDigits];
      document.getElementById('sendBtn').disabled = true;
      const data = await api(payload);
      document.getElementById('sendBtn').disabled = false;
      if (data.ok) toast('발송 '+(data.sent||0)+'건 완료');
      else toast(data.message || '발송 실패');
    }

    function toggleAddMember() { document.getElementById('addMemberPanel').classList.toggle('open'); }

    async function addMember() {
      const name = document.getElementById('addName').value.trim();
      const phone = document.getElementById('addPhone').value.replace(/\D/g,'');
      if (!name || phone.length < 10) { toast('이름·연락처 확인'); return; }
      const data = await api({ action:'instructorAddMember', name:name, phone:phone, saveToSheet:document.getElementById('addSaveSheet').checked });
      if (!data.ok) { toast(data.message||'실패'); return; }
      const suffix8 = data.suffix8 || (phone.length>=11 && /^010/.test(phone) ? phone.slice(3) : phone.slice(-8));
      const entry = { suffix8:suffix8, name:name, phoneDigits:phone, phoneLast4:phone.slice(-4), sessionDisplay:'', time:'', specialNotes:'' };
      const ix = state.customMembers.findIndex(function(c){ return c.suffix8===suffix8; });
      if (ix<0) state.customMembers.push(entry); else state.customMembers[ix]=entry;
      saveCustomMembers();
      document.getElementById('addMemberPanel').classList.remove('open');
      if (data.added) await loadBoard();
      else renderMemberChips();
      selectMember(entry, true);
      toast('추가 완료');
    }

    function evalMemberInfo() {
      const m = state.selected;
      if (!m) return { name: '', phone: '' };
      return {
        name: String(m.name || '').trim(),
        phone: String(m.phoneDigits || '').replace(/\D/g, ''),
      };
    }

    function openEvalModal() {
      const info = evalMemberInfo();
      if (!info.name || info.phone.length < 10) {
        toast('회원을 먼저 선택해 주세요');
        return;
      }
      document.getElementById('evalMemberHint').textContent = info.name + ' · ' + formatPhone(info.phone);
      loadFirstEvalView(info.phone);
      document.getElementById('evalModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeEvalModal() {
      document.getElementById('evalModal').classList.remove('open');
      document.body.style.overflow = '';
    }
    function switchEvalTab(paneId, btn) {
      document.querySelectorAll('.eval-tab').forEach(function(t){ t.classList.remove('on'); });
      document.querySelectorAll('.eval-pane').forEach(function(p){ p.classList.remove('on'); });
      btn.classList.add('on');
      document.getElementById(paneId).classList.add('on');
    }

    async function loadFirstEvalView(phone) {
      if (!phone) return;
      const data = await api({ action:'instructorGetFirstEval', phone:phone });
      const empty = document.getElementById('evalViewEmpty');
      const content = document.getElementById('evalViewContent');
      if (data.ok && data.found && data.eval) {
        empty.hidden = true; content.hidden = false;
        const ev = data.eval;
        document.getElementById('evalViewDate').textContent = (ev.name||'')+' · '+String(ev.date||'').slice(0,16);
        let body = '';
        if (ev.summary) body += '[평가 요약]\n'+ev.summary+'\n\n';
        if (ev.memo) body += '[상세 메모]\n'+ev.memo+'\n\n';
        if (ev.report) body += '[AI 리포트]\n'+ev.report;
        state.evalReportText = body || ev.report || '';
        document.getElementById('evalReportBody').textContent = state.evalReportText || '(내용 없음)';
      } else {
        state.evalReportText = '';
        empty.hidden = false; content.hidden = true;
      }
    }

    async function sendEvalSms() {
      const info = evalMemberInfo();
      const phone = info.phone;
      const text = state.evalReportText || document.getElementById('evalReportBody').textContent;
      if (phone.length < 10) { toast('회원을 선택해 주세요'); return; }
      if (!text || text === '(내용 없음)') { toast('보낼 리포트 없음'); return; }
      const data = await api({
        action:'instructorSendEvalSms',
        phone:phone,
        name: info.name,
        text:text,
      });
      if (data.ok) toast('문자 발송 완료');
      else toast(data.message || '발송 실패');
    }

    async function submitFirstEval() {
      const info = evalMemberInfo();
      if (!info.name || info.phone.length < 10) { toast('회원을 선택해 주세요'); return; }
      document.getElementById('evalSubmitBtn').disabled = true;
      const data = await api({
        action:'submitInstructorFirstEval', name:info.name, phone:info.phone,
        history: document.getElementById('evalHistory').value.trim(),
        inspection: document.getElementById('evalInspection').value.trim(),
        movement: document.getElementById('evalMovement').value.trim(),
        palpation: document.getElementById('evalPalpation').value.trim(),
        memo: document.getElementById('evalMemo').value.trim(),
        sendToMember: document.getElementById('evalSendMember').checked,
      });
      document.getElementById('evalSubmitBtn').disabled = false;
      if (data.ok) {
        toast('저장 완료');
        await loadFirstEvalView(info.phone);
        switchEvalTab('evalView', document.querySelector('.eval-tab[data-pane="evalView"]'));
      } else toast(data.message || '실패');
    }

    document.getElementById('evalModal').addEventListener('click', function(e){ if(e.target===this) closeEvalModal(); });
    document.getElementById('pinInput').addEventListener('keydown', function(e){ if(e.key==='Enter') submitPin(); });
    loadCustomMembers();
    renderProgramList();
    loadBoard();
  </script>
</body>
</html>
